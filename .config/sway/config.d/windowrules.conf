# Inhibit idle in fullscreen
for_window [all] inhibit_idle fullscreen

# Floating windows
for_window [floating] move position center, sticky disable
for_window [title="^Picture-in-Picture$"] floating enable
for_window [title="^Emulator$"] floating enable

# Focus latest spawned window
for_window [shell=".*"] focus

# Calc
for_window  [app_id="org.kde.kcalc"] floating enable

# Device manager
for_window  [app_id="blueman-manager"] floating enable
for_window  [app_id="org.pulseaudio.pavucontrol"] floating enable

# Dolphin
for_window  [app_id="org.kde.dolphin"] floating enable

# Flameshot
for_window  [app_id="flameshot"] border pixel 0, floating enable,

# Policykit Agent
for_window [app_id="lxqt-policykit-agent"] floating enable

# Zotero
for_window  [app_id="Zotero" title="Settings$"] floating enable, move position center
for_window  [app_id="Zotero" title="^Citation"] floating enable, move position center

# Zoom
for_window [class="Zoom" instance="zoom"] floating enable
for_window [class="Zoom" instance="zoom" title="Zoom - Free Account"] floating disable
for_window [class="Zoom" instance="zoom" title="Zoom Meeting"] floating disable
for_window [class="Zoom" instance="zoom" title="Zoom Workplace"] floating disable

